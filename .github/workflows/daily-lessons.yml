
name: Daily Japanese Lessons

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *" # UTC 22:30 = Taiwan 06:30

permissions:
  contents: write

concurrency:
  group: daily-japanese-lessons
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and merge lessons
        env:
          LESSON_FEED_URL: ${{ secrets.LESSON_FEED_URL }}
          LESSON_FEED_TOKEN: ${{ secrets.LESSON_FEED_TOKEN }}
        run: python scripts/sync_lessons.py

      - name: Commit updated lessons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lessons.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily Japanese lessons"
            git push
          fi
