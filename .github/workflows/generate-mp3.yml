name: Generate Japanese MP3 library
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hibi-lesson-import
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/audio-requirements.txt
      - run: python scripts/generate_audio.py
      - name: Commit MP3 files and index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Japanese lesson MP3 audio'
            git push
          fi
