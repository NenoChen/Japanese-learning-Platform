name: Import verified daily PDF and lesson
on:
  workflow_dispatch:
  push:
    paths:
      - 'incoming/**/manifest.json'
permissions:
  contents: write
concurrency:
  group: hibi-lesson-import
  cancel-in-progress: false
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and import PDF and structured lesson
        run: python scripts/import_bundle.py
      - name: Commit new lesson and PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lessons.json materials/
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified daily Japanese lesson'
            git push
          fi
